<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>빈자리찾기</title>
<meta name="description" content="지금 매장에 빈자리가 있는지 3D로 확인하세요." />
<meta name="theme-color" content="#fdf1e2" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='10' y='26' width='44' height='8' rx='3' fill='%2357b38a'/><rect x='14' y='8' width='8' height='26' rx='3' fill='%2357b38a'/><rect x='14' y='34' width='6' height='22' rx='3' fill='%23a0785a'/><rect x='44' y='34' width='6' height='22' rx='3' fill='%23a0785a'/></svg>" />
<style>
  :root {
    --bg1: #fdf1e2; --bg2: #e3f1ec;
    --ink: #3b2f2a; --sub: #8a7a70; --card: rgba(255,255,255,.86);
    --empty: #2fa877; --busy: #ee7a62; --line: rgba(59,47,42,.1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(170deg, var(--bg1) 0%, #fbe8d8 45%, var(--bg2) 100%);
    overscroll-behavior: none;
  }
  html, body { touch-action: manipulation; } /* 두 번 톡 확대 막기 */
  #scene { position: fixed; inset: 0; touch-action: none; }
  #scene canvas { display: block; }

  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 0;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  }
  .brand { font-size: 14px; font-weight: 700; color: var(--sub); letter-spacing: .02em; }
  .count {
    pointer-events: auto; background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 22px; padding: 12px 22px; box-shadow: 0 6px 24px rgba(120,80,50,.14);
    display: flex; align-items: baseline; gap: 8px; border: 1px solid rgba(255,255,255,.7);
  }
  .count .label { font-size: 15px; font-weight: 700; }
  .count .n { font-size: 34px; font-weight: 800; color: var(--empty); font-variant-numeric: tabular-nums; line-height: 1; }
  .count .n.zero { color: var(--busy); }
  .count .tot { font-size: 15px; color: var(--sub); font-weight: 600; }
  .meta { font-size: 12px; color: var(--sub); display: flex; gap: 10px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--empty); display: inline-block; margin-right: 4px; box-shadow: 0 0 0 0 rgba(47,168,119,.5); animation: ping 2s infinite; }
  .dot.off { background: #bbb; animation: none; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(47,168,119,.45);} 70% { box-shadow: 0 0 0 8px rgba(47,168,119,0);} 100% { box-shadow: 0 0 0 0 rgba(47,168,119,0);} }
  .legend { display: flex; gap: 12px; font-size: 12px; font-weight: 600; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 0 16px calc(env(safe-area-inset-bottom) + 14px);
    display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;
  }
  .chips {
    pointer-events: auto; display: flex; gap: 6px; overflow-x: auto; max-width: 100%;
    padding: 4px 2px; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; background: var(--card); border-radius: 14px; padding: 7px 11px; font-size: 13px; font-weight: 700;
    border: 1px solid rgba(255,255,255,.8); box-shadow: 0 2px 8px rgba(120,80,50,.1); white-space: nowrap;
  }
  .chip b { color: var(--empty); }
  .chip.full { opacity: .55; }
  .chip.full b { color: var(--busy); }
  .hint { font-size: 12px; color: var(--sub); background: rgba(255,255,255,.6); padding: 4px 10px; border-radius: 10px; }

  .adminbar {
    pointer-events: auto; display: none; align-items: center; gap: 8px;
    background: #3b2f2a; color: #fff; border-radius: 18px; padding: 8px 8px 8px 14px; font-size: 13px; font-weight: 700;
    box-shadow: 0 6px 20px rgba(0,0,0,.2);
  }
  body.admin .adminbar { display: flex; }
  .adminbar button {
    border: 0; border-radius: 12px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer;
    background: rgba(255,255,255,.15); color: #fff;
  }
  .adminbar button.warn { background: var(--busy); }
  .adminbar button { white-space: nowrap; flex: none; padding: 8px 10px; }
  .adminbar { flex-wrap: wrap; justify-content: center; }
  .adminbar .stats { font-size: 12px; line-height: 1.3; flex: 1 1 100%; text-align: center; }
  /* 관리자 자리 버튼판 */
  .board { display: none; position: fixed; z-index: 4; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 190px); bottom: calc(env(safe-area-inset-bottom) + 112px);
    background: linear-gradient(170deg, var(--bg1) 0%, #fbe8d8 60%, var(--bg2) 100%); padding: 4px 4px; touch-action: manipulation; }
  body.admin:not(.view3d):not(.walking) .board { display: block; }
  body.admin:not(.view3d):not(.walking) .chips, body.admin:not(.view3d):not(.walking) #walkBtn, body.admin:not(.view3d):not(.walking) .hint { display: none !important; }
  .board svg { width: 100%; height: 100%; display: block; }
  .board .room { fill: #fffaf6; stroke: #cdbcb0; stroke-width: .6; }
  .board .barline { fill: none; stroke: #8e4a2c; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
  .board .tbl { fill: #d8b48e; stroke: #9a7350; stroke-width: .5; }
  .board .tlabel { font: 800 4.2px sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; cursor: pointer; }
  .board .tlabel.dark { fill: #5a3a28; }
  .board .door { fill: none; stroke: #2fa877; stroke-width: 1.2; }
  .board .doorlabel { font: 700 3px sans-serif; fill: #2fa877; text-anchor: middle; }
  .board .bs { cursor: pointer; }
  .bdtools { display: none; position: absolute; left: 8px; right: 8px; top: 2px; z-index: 2; gap: 6px; align-items: center; flex-wrap: wrap;
    background: #3b2f2a; color: #fff; border-radius: 14px; padding: 6px 8px; font-size: 12px; font-weight: 700; }
  body.boardedit .bdtools { display: flex; }
  .bdtools span { flex: 1 1 100%; }
  .bdtools button { border: 0; border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 14px; background: rgba(255,255,255,.18); color: #fff; }
  .bdtools button.ok { background: var(--empty); }
  body.boardedit .board svg { padding-top: 70px; box-sizing: border-box; }
  body.boardedit .board .tg { cursor: grab; }
  body.boardedit .board .tg .tbl { stroke: #e8a37a; stroke-width: .9; stroke-dasharray: 1.5 1; }
  .board .tg.sel .tbl, .board .tg.sel .ring, .board .bs.sel .ring { stroke: #3b2f2a; stroke-width: 1.4; }
  body.boardedit .board .bs, body.boardedit .board .barlabel { cursor: grab; }
  .board .barlabel { font-size: 6.2px; }
  body.boardedit .board .barlabel { fill: #c06a3a; text-decoration: underline; }
  body.boardedit .board .tg, body.boardedit .board svg { touch-action: none; }
  body.boardedit .adminbar #resetBtn, body.boardedit .adminbar #view3dBtn { display: none; }
  .board .bs .ring { fill: #fff; stroke: var(--empty); stroke-width: 1.1; transition: fill .2s; }
  .board .bs.occ .ring { fill: var(--busy); stroke: #c95a43; }
  .board .bs .ico { font: 800 4.4px sans-serif; text-anchor: middle; dominant-baseline: central; fill: var(--empty); pointer-events: none; }
  .board .bs.occ .ico { fill: #fff; }
  .board .bs .mins { font: 700 2.7px sans-serif; text-anchor: middle; fill: #fff; pointer-events: none; }
  .board .bs.pend .ring { fill: #fff1e4; stroke: #e8a37a; stroke-dasharray: 2 1.2; }
  .board .bs.pend.toocc .ring { fill: #ffd9cc; }
  .board .bs.pend.toempty .ring { fill: #dff3ea; stroke: var(--empty); }
  .board .bs .timer { fill: none; stroke: #3b2f2a; stroke-width: .9; stroke-dasharray: 32 32; stroke-dashoffset: 0; pointer-events: none; opacity: 0; }
  .board .bs.pend .timer { opacity: .8; animation: bdrain 3s linear forwards; }
  @keyframes bdrain { to { stroke-dashoffset: 32; } }
  .board .bs.pop .ring { animation: bpop .35s ease; transform-box: fill-box; transform-origin: center; }
  @keyframes bpop { 40% { transform: scale(1.18); } }

  .toast {
    position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%) scale(.9); z-index: 20;
    background: rgba(59,47,42,.92); color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 700; font-size: 15px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; text-align: center; white-space: pre-line; width: max-content; max-width: 88vw; line-height: 1.45;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .modal { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(59,47,42,.35); padding: 16px; }
  .modal.show { display: flex; }
  .modal form { background: #fff; border-radius: 20px; padding: 22px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal h2 { margin: 0; font-size: 18px; }
  .modal p { margin: 0; font-size: 13px; color: var(--sub); }
  .modal input { font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #e4d8cf; outline: none; }
  .modal input:focus { border-color: var(--empty); }
  .modal button { font-size: 16px; font-weight: 700; padding: 12px; border-radius: 12px; border: 0; background: var(--empty); color: #fff; cursor: pointer; }
  .modal .err { color: var(--busy); font-size: 13px; min-height: 1em; }
  .modal a { font-size: 13px; color: var(--sub); text-align: center; }

  /* ── 걸어서 둘러보기 (1인칭) ── */
  .walkbtn {
    pointer-events: auto; border: 0; cursor: pointer; font: inherit; font-size: 15px; font-weight: 800;
    color: #fff; background: linear-gradient(180deg, #3fbf8a, #2a9a6c); padding: 12px 20px; border-radius: 18px;
    box-shadow: 0 6px 0 #1f7a55, 0 10px 24px rgba(31,122,85,.35); display: flex; align-items: center; gap: 8px;
    transition: transform .08s, box-shadow .08s;
  }
  .walkbtn[hidden] { display: none; }
  .walkbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f7a55, 0 4px 10px rgba(31,122,85,.3); }
  .walkbtn svg { width: 20px; height: 20px; }
  .walk-ui { display: none; }
  body.walking .walk-ui { display: block; }
  body.walking .brand, body.walking .legend, body.walking .chips, body.walking .hint, body.walking #walkBtn { display: none; }
  body.walking .count { padding: 7px 16px; border-radius: 16px; }
  body.walking .count .n { font-size: 26px; }
  /* 1인칭에선 '빈자리 N' 한 줄만 왼쪽 위에 */
  body.walking .top { align-items: flex-start; }
  body.walking .meta, body.walking .count .tot { display: none; }
  body.walking .count { padding: 6px 14px; gap: 6px; }
  body.walking .count .label { font-size: 13px; }
  body.walking .count .n { font-size: 22px; }
  body.intro .reticle, body.intro .aim, body.intro .mapbtn, body.intro .joy { display: none !important; }
  body.entering .reticle, body.entering .aim, body.entering .mapbtn, body.entering .joy { display: none !important; }
  .introbox { display: none; position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; padding: 0 16px calc(env(safe-area-inset-bottom) + 28px); justify-content: center; pointer-events: none; }
  body.intro .introbox { display: flex; }
  /* 입장 버튼: 작고 가벼운 한 줄 */
  .introcard {
    pointer-events: auto; display: flex; flex-direction: row; align-items: center; gap: 12px;
    background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 999px; padding: 6px 6px 6px 18px; box-shadow: 0 6px 18px rgba(20,10,30,.25);
    animation: rise .6s cubic-bezier(.2,1.4,.4,1) both .3s;
  }
  .introcard small { display: none; }
  .introname { display: flex; flex-direction: column; line-height: 1.15; }
  .introname em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--empty); }
  .introname em:empty { display: none; }
  .introname em.closed { color: var(--busy); }
  .introcard strong { font-size: 14px; font-weight: 800; letter-spacing: .02em; }
  .introcard .walkbtn { padding: 8px 18px; font-size: 14px; border-radius: 999px; box-shadow: 0 3px 0 #1f7a55; }
  .introcard .walkbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1f7a55; }
  /* 가게 앞(입구)에서는 빈자리 수 숨김 */
  body.intro .top { display: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
  body { transition: background .8s; }
  /* 손그림 그림체(?style=line): 파스텔 하늘 */
  html.line body { background: linear-gradient(170deg, #f6e3f3 0%, #f3e6ee 50%, #e6f1e4 100%); }
  html.line body.night { background: linear-gradient(180deg, #dcbcf0 0%, #ecd0f0 55%, #f6e2ea 100%); }
  html.line.sky-dusk body { background: linear-gradient(170deg, #c9b3e3 0%, #f3c1c6 55%, #f6d9c4 100%); }
  html.line.sky-night body { background: linear-gradient(170deg, #241f3a 0%, #3a2c45 55%, #4a3440 100%); }
  html.line.sky-night .hint { background: rgba(255,255,255,.75); }
  html.line.sky-dusk body.night { background: linear-gradient(180deg, #8f7fd0 0%, #f39fb0 50%, #ffc98f 100%); }
  html.line.sky-night body.night { background: linear-gradient(180deg, #121736 0%, #252a5c 55%, #3b3567 100%); }
  body.night { background: linear-gradient(180deg, #0a1020 0%, #1a2236 55%, #2b2a33 100%); }
  .stats { cursor: pointer; text-decoration: underline dotted rgba(255,255,255,.5); text-underline-offset: 3px; }
  .reticle {
    position: fixed; z-index: 4; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none;
    border-radius: 50%; border: 2.5px solid rgba(255,255,255,.95); box-shadow: 0 0 0 1.5px rgba(59,47,42,.35);
    transition: transform .15s, border-color .15s;
  }
  body.aiming .reticle { transform: scale(1.35); }
  .aim {
    position: fixed; z-index: 4; left: 50%; top: calc(50% + 26px); transform: translateX(-50%) translateY(6px);
    background: rgba(59,47,42,.88); color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 14px; font-weight: 700;
    opacity: 0; transition: opacity .15s, transform .15s; pointer-events: none; text-align: center; white-space: nowrap;
  }
  .aim.show { opacity: 1; transform: translateX(-50%); }
  .aim b { margin-right: 6px; }
  .aim.free b { color: #7be0b3; }
  .aim.busy b { color: #ffab99; }
  .aim small { display: block; font-size: 11px; font-weight: 600; opacity: .75; margin-top: 2px; }
  .mapbtn {
    position: fixed; z-index: 5; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 18px); width: 112px; padding: 4px 4px 2px;
    border: 0; border-radius: 14px; background: rgba(255,255,255,.8); box-shadow: 0 4px 14px rgba(0,0,0,.15); cursor: pointer; font: inherit;
  }
  .mapbtn canvas { display: block; width: 100%; }
  .mapbtn { display: none !important; } /* 전체 지도 숨김 */
  .mapbtn span { display: block; font-size: 11px; font-weight: 800; color: var(--ink); padding: 2px 0 3px; }
  .joy {
    position: fixed; z-index: 6; left: 22px; bottom: calc(env(safe-area-inset-bottom) + 22px); width: 120px; height: 120px;
    border-radius: 50%; background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.8);
    box-shadow: 0 4px 16px rgba(0,0,0,.12); touch-action: none; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .joy i {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(255,255,255,.95); box-shadow: 0 3px 10px rgba(0,0,0,.2); pointer-events: none;
  }
  @media (pointer: fine) { .joy { display: none !important; } }
  .actbtns { position: fixed; z-index: 6; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 30px); display: flex; gap: 12px; }
  .actbtns button {
    width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8); background: rgba(255,255,255,.35);
    color: #fff; font: 800 12px/1.15 inherit; white-space: nowrap; letter-spacing: -0.5px; text-shadow: 0 1px 3px rgba(0,0,0,.5); box-shadow: 0 4px 16px rgba(0,0,0,.12);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); touch-action: none; cursor: pointer; font-family: inherit;
  }
  .actbtns button:active { transform: scale(.94); }
  .actbtns button.seatable { background: rgba(47,168,119,.85); border-color: #bff0d8; }
  body.intro .actbtns, body.entering .actbtns { display: none !important; }
  body.walking.admin .actbtns { bottom: calc(env(safe-area-inset-bottom) + 84px); }
  body.walking.admin .mapbtn, body.walking.admin .joy { bottom: calc(env(safe-area-inset-bottom) + 76px); }
  body.walking .adminbar > span { display: none; }

  /* 처음 켜질 때 로딩 화면 (3D 준비되면 사라짐) */
  .boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #0f0909; transition: opacity .6s; }
  .boot-logo { width: min(62vw, 300px); height: auto; display: block; }
  .boot-name { color: #f4e7d6; font-size: 22px; font-weight: 800; letter-spacing: .12em; }
  .boot-dots { display: flex; gap: 8px; }
  .boot-dots i { width: 8px; height: 8px; border-radius: 50%; background: #f3b06a; animation: bootdot 1.2s infinite ease-in-out; }
  .boot-dots i:nth-child(2) { animation-delay: .15s; } .boot-dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bootdot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-5px); } }
  body:not(.booting) .boot { opacity: 0; pointer-events: none; }
  body.booting .top, body.booting .bottom { visibility: hidden; }
  .nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: var(--sub); padding: 24px; }
  @media (min-width: 720px) { .count .n { font-size: 40px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>

<body class="booting">
  <div class="boot" id="boot">
    <img class="boot-logo" src="/logo.jpg" alt="DIVE HIDE AWAY" />
    <div class="boot-dots"><i></i><i></i><i></i></div>
  </div>
  <div id="scene"></div>
  <div class="nogl" id="nogl">이 기기에서는 3D 화면을 표시할 수 없어요.<br />아래 목록으로 빈자리를 확인해 주세요.</div>

  <header class="top">
    <div class="brand" id="brand">빈자리찾기</div>
    <div class="count" aria-live="polite">
      <span class="label">빈자리</span>
      <span class="n" id="nEmpty">–</span>
      <span class="tot" id="nTotal">/ – 석</span>
    </div>
    <div class="meta">
      <span><span class="dot" id="liveDot"></span><span id="updated">불러오는 중…</span></span>
    </div>
    <div class="legend">
      <span><i style="background:var(--empty)"></i>빈자리</span>
      <span><i style="background:var(--busy)"></i>사용 중</span>
    </div>
  </header>

  <!-- 관리자 자리 버튼판 (기본 화면) -->
  <div class="board" id="board">
    <div class="bdtools"><span id="bdSel">테이블·의자 칸을 끌어서 옮기기 · 의자 칸은 눌러서 ⟲⟳ 회전</span>
      <button type="button" id="bdMinus">−</button><button type="button" id="bdPlus">+</button><button type="button" id="bdRotL">⟲</button><button type="button" id="bdRotR">⟳</button>
      <button type="button" id="bdReset">기본값</button><button type="button" id="bdSetDef">기본값으로</button><button type="button" id="bdCancel">취소</button><button type="button" class="ok" id="bdSave">저장</button></div>
    <svg id="boardSvg" viewBox="-8 -6 111 112" preserveAspectRatio="xMidYMid meet"></svg></div>

  <footer class="bottom">
    <div class="hint" id="hint">손가락으로 돌려보고, 두 손가락으로 확대할 수 있어요</div>
    <div class="chips" id="chips"></div>
    <button type="button" class="walkbtn" id="walkBtn" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="13" cy="4" r="2.2"/><path d="M9.8 8.6 7 10.2V14h2v-2.6l1.4-.8-1.6 7.9L5 17.6l-.5 2 5.6 1.1 1.3-5.6 2.1 2V22h2v-6.2l-2.1-2 .6-3 1 1.5c.9 1.3 2.4 2 4 2V12.3c-.9 0-1.7-.4-2.2-1.2l-1-1.6c-.4-.7-1.2-1.1-2-1.1-.3 0-.5 0-.8.1z"/></svg>
      매장 안으로 들어가기
    </button>
    <div class="adminbar">
      <span class="stats" id="stats" role="button" title="최근 7일 보기">관리자 · 자리를 눌러 바꾸기</span>
      <button type="button" id="boardEditBtn">배치 편집</button>
      <button type="button" id="view3dBtn">3D 보기</button>
      <button type="button" class="warn" id="resetBtn">전체 비우기</button>
      <button type="button" id="logoutBtn">나가기</button>
    </div>
  </footer>

  <div class="walk-ui">
    <div class="reticle"></div>
    <div class="aim" id="aim"></div>
    <button type="button" class="mapbtn" id="mapBtn" aria-label="전체 지도 보기"><canvas id="minimap"></canvas><span>전체 지도</span></button>
    <div class="joy" id="joy"><i></i></div>
    <div class="actbtns"><button type="button" id="sitBtn">앉기</button><button type="button" id="jumpBtn">점프</button></div>
  </div>

  <div class="introbox" id="intro">
    <div class="introcard">
      <small>어서 오세요</small>
      <span class="introname"><strong id="introName">DIVE HIDE AWAY</strong><em id="introOpen"></em></span>
      <button type="button" class="walkbtn" id="enterBtn">입장하기</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal" id="login">
    <form id="loginForm">
      <h2>관리자 로그인</h2>
      <p>자리 상태를 바꾸려면 비밀번호를 입력하세요.</p>
      <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" required />
      <div class="err" id="loginErr"></div>
      <button type="submit">들어가기</button>
      <a href="/">손님 화면으로</a>
    </form>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
