name = "heyhome-smart-ac"
main = "src/index.ts"
compatibility_date = "2024-11-06"

# 10분마다 자동 실행 (센서 읽고 에어컨 조정)
[triggers]
crons = ["*/10 * * * *", "* * * * *"]

# 설정/상태 저장용 KV. 아래 id 는 `wrangler kv namespace create SMART_AC_KV` 로 만든 값으로 교체
[[kv_namespaces]]
binding = "KV"
id = "f801f704a4f04f63b511650e94febdd6"

# 시크릿은 코드/파일에 두지 말고 아래 명령으로 등록:
#   wrangler secret put HEJ_EMAIL
#   wrangler secret put HEJ_PASSWORD
#   wrangler secret put OWM_API_KEY
#   wrangler secret put ADMIN_TOKEN   # (선택) UI 보호용 임의 문자열
